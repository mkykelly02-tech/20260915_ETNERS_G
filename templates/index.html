<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>ETNERS 할일관리</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>할일관리</h1>
            <div class="user-info">
                <span>{{ username }}님</span>
                <form action="{{ url_for('logout') }}" method="post">
                    <button type="submit" class="logout-btn">로그아웃</button>
                </form>
            </div>
        </div>

        <form action="{{ url_for('add') }}" method="post" class="add-form">
            <input type="text" name="title" placeholder="할 일을 입력하세요" autofocus required>
            <button type="submit">추가</button>
        </form>

        <ul class="todo-list">
            {% for todo in todos %}
            <li class="{{ 'done' if todo['done'] else '' }}">
                <form action="{{ url_for('toggle', todo_id=todo['id']) }}" method="post" class="toggle-form">
                    <button type="submit" class="check-btn">
                        {{ '✅' if todo['done'] else '⬜' }}
                    </button>
                </form>
                <span class="title">{{ todo['title'] }}</span>
                <form action="{{ url_for('delete', todo_id=todo['id']) }}" method="post" class="delete-form">
                    <button type="submit" class="delete-btn">삭제</button>
                </form>
            </li>
            {% else %}
            <li class="empty">등록된 할 일이 없습니다.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
