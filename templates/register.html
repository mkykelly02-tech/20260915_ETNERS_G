<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>회원가입 · ETNERS 할일관리</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container auth-container">
        <h1>회원가입</h1>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('register') }}" method="post" class="auth-form">
            <input type="text" name="username" placeholder="아이디" autofocus required>
            <input type="password" name="password" placeholder="비밀번호" required>
            <button type="submit">회원가입</button>
        </form>

        <p class="auth-switch">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
    </div>
</body>
</html>
